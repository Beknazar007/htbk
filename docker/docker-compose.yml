services:
  postgres:
    image: postgres:16-alpine
    container_name: noorjourney-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: noorjourney
      POSTGRES_PASSWORD: noorjourney
      POSTGRES_DB: noorjourney
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: noorjourney-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  postgres_data:
